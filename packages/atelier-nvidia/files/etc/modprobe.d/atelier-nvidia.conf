# Atelier — NVIDIA kernel options (Void nvidia 595.x open kernel module).
#
# These lines are what `modprobe --show-depends nvidia` prints. They are NOT
# what the boot insert uses. nvidia.ko is inserted at about 2s (fbcon binds
# nvidia-drm right after) by udev/kmod while the initramfs is still the
# modprobe configuration. The .ko is not stored in the initramfs; it is read
# from the mounted root, so `lsinitrd` shows no nvidia file. The resident
# module keeps the 595.112.07 defaults (PreserveVideoMemoryAllocations=2,
# TemporaryFilePath empty, UseKernelSuspendNotifiers=0) even though a later
# modprobe on the real root would pass the values below.
#
# /proc/driver/nvidia/params prints those module parameters. They are not in
# /sys/module/nvidia/parameters/ because the driver registers them with
# permission 0.
#
# The boot insert does honor nvidia.NVreg_*= tokens on the kernel command
# line (kmod reads /proc/cmdline). atelier-nvidia-grub adds them to
# GRUB_CMDLINE_LINUX_DEFAULT. Keep this file too, for a later modprobe.
#
# modeset=1: kernel modesetting for the XLibre modesetting DDX.
# fbdev=1: framebuffer console (driver default since 545; pinned).
options nvidia-drm modeset=1 fbdev=1

# One line. Preserve=1 saves every allocation (the modesetting scanout is
# not in the "auto" subset). TemporaryFilePath must be a directory on a
# filesystem large enough for the GPU memory; /var/tmp is on the root fs.
# UseKernelSuspendNotifiers=0 keeps /proc/driver/nvidia/suspend. The 595
# README requires that file when Preserve=1. S0ix stays at the default 0
# (this desktop suspends with mem_sleep "deep").
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UseKernelSuspendNotifiers=0
