# Atelier — NVIDIA kernel options (proprietary userspace, Void's open kernel
# modules from the nvidia package).
#
# modeset=1: kernel modesetting. XLibre uses the modesetting DDX against
# nvidia-drm, not nvidia_drv.so (video ABI mismatch).
# fbdev=1: framebuffer console on that DRM device, so the VT switch in
# nvidia-sleep.sh has a console to leave and return to. Driver 545+ defaults
# this to 1; pin it so a later default change cannot drop the console.
options nvidia-drm modeset=1 fbdev=1

# Suspend-to-RAM on a discrete GPU (RTX 4060 Ti desktop, mem_sleep "deep").
#
# PreserveVideoMemoryAllocations=2 is the driver default ("auto"): save every
# allocation only when kernel suspend notifiers are enabled. Otherwise only
# a subset is saved, and the modesetting scanout buffer is not in that subset.
# Wake then leaves a black screen until reboot.
#
# =1 saves every allocation. The 595 power-management README requires the
# procfs interface (/proc/driver/nvidia/suspend) when this is set.
# /etc/elogind/system-sleep/atelier-nvidia is that interface: it runs
# nvidia-sleep.sh with suspend or hibernate, then resume.
#
# UseKernelSuspendNotifiers=0 keeps the proc file available. The notifier
# default (1) hides /proc/driver/nvidia/suspend on the open modules, and the
# driver then refuses the cycle ("attempted without driver procfs suspend
# interface", -EIO). One path only.
#
# The unnamed VRAM file defaults to /tmp, which is often a small tmpfs.
# An 8 or 16 GiB 4060 Ti needs a real filesystem. /var/tmp is on the root fs.
#
# EnableS0ixPowerManagement is left at the driver default (0). S0ix applies
# when mem_sleep is s2idle and both the platform and the GPU support video
# memory self-refresh. This desktop suspends with "deep". Turning S0ix on
# here does not restore an S3 cycle.
#
# Options apply the next time nvidia.ko loads (reboot). If the modules are
# already inside the initramfs, that image must be regenerated so the early
# load sees this file (the atelier-nvidia install script runs dracut). Do not
# force nvidia into the initramfs: 595 fails hibernation restore when the
# driver is loaded that early.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
options nvidia NVreg_UseKernelSuspendNotifiers=0
