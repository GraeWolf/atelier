# Atelier — Xorg / Xlibre OutputClass for proprietary NVIDIA
# Works with the Void nonfree `nvidia` package (GLVND + nvidia_drv.so).
# Safe to ship only on systems that install atelier-nvidia.

Section "OutputClass"
	Identifier "atelier-nvidia"
	MatchDriver "nvidia-drm"
	Driver "nvidia"
	Option "AllowEmptyInitialConfiguration" "true"
	Option "PrimaryGPU" "yes"
	ModulePath "/usr/lib/nvidia/xorg"
	ModulePath "/usr/lib/xorg/modules"
EndSection
