# Atelier — starship (Tokyo Night accents)
# https://starship.rs/config/

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vicmd_symbol = "[❮](bold #9ece6a)"

[directory]
style = "bold #7dcfff"
truncation_length = 3
truncate_to_repo = true

[username]
style_user = "bold #bb9af7"
style_root = "bold #f7768e"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
style = "bold #e0af68"
format = "at [$hostname]($style) "

[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #f7768e"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = "bold #e0af68"
format = "took [$duration]($style) "
