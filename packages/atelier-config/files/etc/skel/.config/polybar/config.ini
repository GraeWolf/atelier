; Atelier — polybar (Tokyo Night)
; Dual bars: atelier-primary (tray) / atelier-secondary
; Colors match configs/colors/tokyo-night.conf

[colors]
background = #1a1b26
background-alt = #292e42
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #565f89
green = #9ece6a
yellow = #e0af68
cyan = #7dcfff

; Shared bar chrome (both monitors)
[bar/base]
width = 100%
height = 28pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

; Fira Code + Nerd Font Symbols (atelier-base)
font-0 = Fira Code:size=10;2
font-1 = Symbols Nerd Font:size=12;3

modules-left = xworkspaces
modules-center = date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm

; Primary monitor: workspaces 1-6 + system tray
[bar/atelier-primary]
inherit = bar/base
modules-right = cpu memory network pulseaudio xkeyboard tray

; Secondary monitor: workspaces 7-9 (no tray — X11 allows one tray host)
[bar/atelier-secondary]
inherit = bar/base
modules-right = cpu memory network pulseaudio xkeyboard

; --- Modules -----------------------------------------------------------------

[module/xworkspaces]
type = internal/xworkspaces
; Only desktops on this bar's monitor (primary 1-6, secondary 7-9)
pin-workspaces = true
enable-click = true
enable-scroll = true
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "mem "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%

; Network up/down — click opens floating nmtui (NetworkManager)
[module/network]
type = custom/script
exec = $HOME/.config/polybar/net-status.sh
interval = 2
format = <label>
format-prefix = " "
label = %output%
click-left = $HOME/.config/polybar/nmtui-float.sh &

; Volume: icon + % ; scroll wheel changes volume (interval = step %)
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.cyan}
label-volume = %percentage%%
label-muted = %{T2}󰝟%{T-} muted
label-muted-foreground = ${colors.disabled}
; Nerd Font Symbols (font-1)
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
click-right = pavucontrol &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 1
label-indicator-background = ${colors.background-alt}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}

; System tray — only on atelier-primary
[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 6px

[settings]
screenchange-reload = true
pseudo-transparency = true
