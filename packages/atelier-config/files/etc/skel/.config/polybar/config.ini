; Atelier — polybar
; Dual bars: atelier-primary (tray) / atelier-secondary
; Palette is generated by atelier-theme into ~/.config/atelier/current/

; Relative to this file (~/.config/polybar/). Do not use ${env:HOME} here:
; polybar does not expand env vars in include-file and the bar fails to start.
include-file = ../atelier/current/polybar-colors.ini

; Shared bar chrome (both monitors)
; CRITICAL: monitor = ${env:MONITOR:} so launch.sh can place each bar
[bar/base]
monitor = ${env:MONITOR:}
monitor-fallback =
monitor-strict = false
width = 100%
height = 28pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

; Fira Code + Nerd Font Symbols (atelier-base)
font-0 = Fira Code:size=10;2
font-1 = Symbols Nerd Font:size=12;3

; bspwm module (not xworkspaces) so we can use ws-icon-N → %icon%
modules-left = bspwm
modules-center = date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm

; Primary monitor: workspaces 1-6 + system tray
[bar/atelier-primary]
inherit = bar/base
modules-right = cpu memory network pulseaudio xkeyboard tray

; Secondary monitor: workspaces 7-9 (no tray — X11 allows one tray host)
[bar/atelier-secondary]
inherit = bar/base
modules-right = cpu memory network pulseaudio xkeyboard

; --- Modules -----------------------------------------------------------------

; Workspace icons (Nerd Font = font-1 via %{T2}…%{T-})
; Format: ws-icon-N = <bspwm-desktop-name>;<icon>
; Desktop names are 1–9 from bspwmrc (primary 1–6, secondary 7–9).
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = true
fuzzy-match = true

; name;icon  — name must match bspc desktop names
ws-icon-0 = 1;%{T2}%{T-}
ws-icon-1 = 2;%{T2}󱃖%{T-}
ws-icon-2 = 3;%{T2}%{T-}
ws-icon-3 = 4;%{T2}󰇮%{T-}
ws-icon-4 = 5;%{T2}%{T-}
ws-icon-5 = 6;%{T2}%{T-}
ws-icon-6 = 7;%{T2}%{T-}
ws-icon-7 = 8;%{T2}%{T-}
ws-icon-8 = 9;%{T2}%{T-}
ws-icon-default = %{T2}%{T-}

format = <label-state> <label-mode>

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

; Mode indicators (optional; empty = hide)
label-monocle =
label-tiled =
label-fullscreen =
label-floating =
label-pseudotiled =
label-locked =
label-sticky =
label-private =

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "mem "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%

; Network up/down — click opens floating nmtui (NetworkManager)
[module/network]
type = custom/script
exec = $HOME/.config/polybar/net-status.sh
interval = 2
format = <label>
format-prefix = " "
label = %output%
click-left = $HOME/.config/polybar/nmtui-float.sh &

; Volume: icon + % ; scroll wheel changes volume (interval = step %)
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.cyan}
label-volume = %percentage%%
label-muted = %{T2}󰝟%{T-} muted
label-muted-foreground = ${colors.disabled}
; Nerd Font Symbols (font-1)
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
click-right = pavucontrol &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 1
label-indicator-background = ${colors.background-alt}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}

; System tray — only on atelier-primary
[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 6px

[settings]
screenchange-reload = true
pseudo-transparency = true
