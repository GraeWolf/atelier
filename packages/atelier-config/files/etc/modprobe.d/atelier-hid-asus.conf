# ASUS ROG N-KEY (USB 0b05:19b6, ITE 8910): hid-asus rebinds the
# hid-generic keyboard after switch-root. The kernel VT then gets no
# keys, so TTY login (and previously LUKS) need an external keyboard.
# X/libinput still sees the device once the session starts.
#
# Keep hid-generic for the console. RGB via hidraw still works.
# Kernel asus::kbd_backlight will not appear without hid-asus.
blacklist hid_asus
