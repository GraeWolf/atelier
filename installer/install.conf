# Atelier desktop preset
# Shipped on the live ISO as /etc/atelier/install.conf (atelier-installer).
# Override with: sudo atelier-install --preset FILE
#
# A value set here is not asked. Change it from the summary screen (Edit),
# or edit this file before starting the installer.
# Passwords are never stored here.
#
# Root is locked. USERNAME is created in the wheel group and uses sudo.
# Target machine: one UEFI desktop, NVIDIA when a GPU is present, bspwm.

HOSTNAME=atelier
# Lowercase login name. Invalid names are rejected, not rewritten.
USERNAME=atelier
TIMEZONE=America/New_York
LOCALE=en_US.UTF-8
KEYMAP=us
MIRROR=https://repo-default.voidlinux.org/current

# auto: proprietary NVIDIA drivers only when a GPU is detected
# yes or no: force
NVIDIA=auto

# LUKS2 on root. /boot stays unencrypted. Passphrase is prompted when yes.
ENCRYPT=no

# Hibernation swapfile (/swapfile, RAM rounded up). no = no swap.
SWAP=no

# GRUB. Keep yes on a normal UEFI desktop.
GRUB=yes

# Extra XBPS packages, space-separated. Not part of the installer base list.
# dropbox is Void nonfree; remove it here to skip it.
PACKAGES="dropbox"
