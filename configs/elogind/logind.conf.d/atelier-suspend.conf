# Cap how long a delay inhibitor can postpone suspend or shutdown.
# xss-lock ("Lock screen first"), NetworkManager, and RealtimeKit take
# sleep/delay locks. elogind's compiled default is 5s; a stuck locker fd
# used to hold the machine until that cap. The locker closes its fd in
# about a second. 10s is the backstop if it does not.
[Login]
InhibitDelayMaxSec=10
