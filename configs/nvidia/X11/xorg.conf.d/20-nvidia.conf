# Atelier — NVIDIA OutputClass
#
# Void's nvidia package installs Driver "nvidia" (proprietary DDX) in
# /usr/share/X11/xorg.conf.d/10-nvidia-drm-outputclass.conf. That DDX is
# built for X.Org video ABI 25. Xlibre reports ABI 28 and can crash or
# refuse nvidia_drv.so.
#
# Use the in-tree modesetting DDX against nvidia-drm instead. GL/Vulkan
# still come from nvidia-libs; hybrid offload is prime-run.
#
# Do not set PrimaryGPU: hybrid laptops (AMD/Intel iGPU + NVIDIA) drive
# the panel from the iGPU. PrimaryGPU yes blacks those machines out.

Section "OutputClass"
	Identifier "atelier-nvidia"
	MatchDriver "nvidia-drm"
	Driver "modesetting"
	Option "AllowEmptyInitialConfiguration" "true"
EndSection
