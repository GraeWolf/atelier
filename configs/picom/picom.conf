# Atelier — picom (Tokyo Night friendly, keep it light)

# Backend
backend = "glx";
vsync = true;

# Shadows (subtle)
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.35;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Conky'",
	"class_g ?= 'Notify-osd'",
	"class_g = 'Cairo-clock'",
	"_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# Opacity (mostly opaque for clarity)
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur off for performance / NVIDIA friendliness (revisit in Step 6)
# blur-method = "dual_kawase";
# blur-strength = 3;

# Corners
corner-radius = 6;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

# Wintypes
wintypes: {
	tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
	dock = { shadow = false; clip-shadow-above = true; };
	dnd = { shadow = false; };
	popup_menu = { opacity = 0.98; };
	dropdown_menu = { opacity = 0.98; };
};

# Avoid tearing / common issues
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-stencil = true;
