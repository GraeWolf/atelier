# Atelier — picom
# Default backend is xrender: works in VMs and on weak GL stacks.
# On a real NVIDIA/AMD host you may switch to: backend = "glx";
# (see comments at bottom)

# --- Backend (VM-safe default) -----------------------------------------------
backend = "xrender";
vsync = true;

# --- Shadows -----------------------------------------------------------------
shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.30;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Conky'",
	"class_g ?= 'Notify-osd'",
	"class_g = 'Rofi'",
	"class_g = 'rofi'",
	"_GTK_FRAME_EXTENTS@:c"
];

# --- Fading ------------------------------------------------------------------
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# --- Opacity (keep fully opaque — avoids “invisible text” with broken GL) ----
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur off (performance + driver friendliness)
# blur-method = "dual_kawase";

# Rounded corners need a capable backend; keep modest for xrender
corner-radius = 0;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

# --- Wintypes ----------------------------------------------------------------
wintypes: {
	tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
	dock = { shadow = false; clip-shadow-above = true; };
	dnd = { shadow = false; };
	popup_menu = { opacity = 1.0; shadow = false; };
	dropdown_menu = { opacity = 1.0; shadow = false; };
	menu = { opacity = 1.0; shadow = false; };
};

# --- General -----------------------------------------------------------------
# use-damage is faster but glitches on some VM/GPU stacks; keep off for reliability
use-damage = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Do NOT set legacy glx-* keys here (e.g. glx-no-stencil): they error on picom 12+
# and are meaningless with the xrender backend.
#
# Optional NVIDIA / strong-GL profile (manual):
#   backend = "glx";
#   vsync = true;
#   use-damage = true;
#   corner-radius = 6;
