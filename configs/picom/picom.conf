# Atelier — picom
# Goals: reduce tearing (vsync), terminal transparency, fully opaque browsers.
#
# Default backend is glx when available (better vsync/tearing); bspwmrc falls
# back to plain xrender if this config fails to start.

# --- Backend -----------------------------------------------------------------
# glx: better vsync / less tearing on real GPUs (incl. NVIDIA + video)
# xrender: safer in VMs — used as automatic fallback from bspwmrc
backend = "glx";
vsync = true;

# Fullscreen apps (video) can unredirect for smoother playback
unredirect-if-possible = true;

# --- Shadows -----------------------------------------------------------------
shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.30;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Conky'",
	"class_g ?= 'Notify-osd'",
	"class_g = 'Rofi'",
	"class_g = 'rofi'",
	"class_g = 'Polybar'",
	"class_g = 'polybar'",
	"_GTK_FRAME_EXTENTS@:c"
];

# --- Fading ------------------------------------------------------------------
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# --- Opacity -----------------------------------------------------------------
# Defaults fully opaque; per-class rules below for terminals only.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Terminals slightly transparent; browsers and media forced opaque.
# class_g values: check with `xprop | grep WM_CLASS` if a name is wrong.
opacity-rule = [
	"100:class_g = 'firefox'",
	"100:class_g = 'Firefox'",
	"100:class_g = 'firefox-esr'",
	"100:class_g = 'Brave-browser'",
	"100:class_g = 'brave-browser'",
	"100:class_g = 'Chromium'",
	"100:class_g = 'chromium'",
	"100:class_g = 'Google-chrome'",
	"100:class_g = 'google-chrome'",
	"100:class_g = 'Vivaldi-stable'",
	"100:class_g = 'mpv'",
	"100:class_g = 'vlc'",
	"100:class_g = 'Polybar'",
	"100:class_g = 'polybar'",
	"92:class_g = 'ghostty'",
	"92:class_g = 'com.mitchellh.ghostty'",
	"92:class_g = 'Ghostty'",
	"92:class_g = 'XTerm'",
	"92:class_g = 'xterm'",
	"92:class_g = 'URxvt'",
	"92:class_g = 'Alacritty'",
	"92:class_g = 'kitty'"
];

# Blur off by default (costly); enable later if desired with glx
# blur-method = "dual_kawase";

corner-radius = 0;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

# --- Wintypes ----------------------------------------------------------------
wintypes: {
	tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
	dock = { shadow = false; clip-shadow-above = true; opacity = 1.0; };
	dnd = { shadow = false; };
	popup_menu = { opacity = 1.0; shadow = false; };
	dropdown_menu = { opacity = 1.0; shadow = false; };
	menu = { opacity = 1.0; shadow = false; };
	# Keep fullscreen (video) unredirect-friendly
	fullscreen = { fade = false; shadow = false; opacity = 1.0; focus = true; };
};

# --- General -----------------------------------------------------------------
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Do NOT set legacy glx-* keys here (e.g. glx-no-stencil): they error on picom 12+.
#
# If glx fails (common in some VMs), bspwmrc retries: picom --backend xrender
